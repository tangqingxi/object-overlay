[project]
name = "object-overlay"
version = "0.1.0"
description = "从视频生成目标对象的多时刻叠加图"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]

[project.scripts]
object-overlay = "object_overlay.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv.extra-build-dependencies]
sam-2 = ["setuptools>=61", "torch>=2.5.1"]
